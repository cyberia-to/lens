# ---
# tags: lens, config
# crystal-type: source
# crystal-domain: comp
# ---
[workspace]
resolver = "3"
members = [
    "core",
    "brakedown", "binius", "ikat", "assayer", "porphyry",
    "src",
    "cli",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/cyberia-to/lens"
rust-version = "1.89"

[workspace.dependencies]
# algebra crates — version+path for crates.io publish
strata-core = { version = "0.1.0", path = "../strata/core" }
strata-proof = { version = "0.1.0", path = "../strata/proof" }
nebu = { version = "0.1.0", path = "../strata/nebu/rs", package = "strata-nebu" }
kuro = { version = "0.1.0", path = "../strata/kuro/rs", package = "strata-kuro" }
jali = { version = "0.1.0", path = "../strata/jali/rs", package = "strata-jali" }
trop = { version = "0.1.0", path = "../strata/trop/rs", package = "strata-trop" }
genies = { version = "0.1.0", path = "../strata/genies/rs", package = "strata-genies" }

# external
cyber-hemera = { version = "0.3", path = "../hemera/rs" }
acpu = "0.2"
criterion = "0.5"
