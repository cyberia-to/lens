[package]
name = "cyber-lens"
version.workspace = true
edition.workspace = true
license-file = "../LICENSE"
description = "polynomial commitment: five lenses for five algebras"
repository.workspace = true
rust-version.workspace = true
keywords = ["pcs", "zk", "crypto", "pcs"]
categories = ["cryptography"]
readme = "../README.md"
exclude = ["../specs/", "../CLAUDE.md"]

[lib]
name = "lens"
path = "lib.rs"

[dependencies]
cyber-lens-core = { version = "0.1.1", path = "../core" }
cyber-lens-brakedown = { version = "0.1.1", path = "../brakedown" }
cyber-lens-binius = { version = "0.1.1", path = "../binius" }
cyber-lens-ikat = { version = "0.1.1", path = "../ikat" }
cyber-lens-assayer = { version = "0.1.1", path = "../assayer" }
cyber-lens-porphyry = { version = "0.1.1", path = "../porphyry" }

[dev-dependencies]
nebu.workspace = true
kuro.workspace = true
trop.workspace = true
genies.workspace = true
cyber-hemera.workspace = true
